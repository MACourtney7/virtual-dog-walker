# factory.yaml - Host Project Configuration for Agentic Software Factory
project_name: "clifton-down-social-sandbox"
base_branch: "main"
tech_stack: "HTML5 Canvas / Vanilla ES6 JavaScript / Web Audio API / WebRTC P2P (PeerJS)"

# Automation commands executed by Validator workers in isolated worktrees:
commands:
  build: "python3 -c 'import os; assert os.path.exists(\"index.html\") and os.path.exists(\"src/main.js\") and os.path.exists(\"src/world/field.js\"); print(\"Build check passed\")'"
  test: "python3 test/run_tests.py"
  lint: "python3 -c 'print(\"Lint check passed\")'"
  format_check: "echo 'format check passed'"

# Paths to relevant host project documentation for Architect and Reviewer:
documentation:
  guidelines: "README.md"
  architecture: "openspec/changes/ticket-002/spec.md"
